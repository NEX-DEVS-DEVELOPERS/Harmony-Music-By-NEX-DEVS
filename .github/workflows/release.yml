name: Build Android, Windows and Linux
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - 'claude/magical-hamilton-vraf5r'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        # Signed with the debug key (see android/app/build.gradle) so it is installable.
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    # windows-2022 (VS 2022 + older CMake): windows-latest now ships VS 2026 whose
    # CMake refuses to extract the audiotags/smtc_windows prebuilt libs through
    # plugin symlinks, which breaks the install step.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: |
          flutter clean
          flutter pub get
          flutter build windows --release

      - name: Package Windows (Zip)
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\windows\harmony_music_windows.zip

      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build\windows\harmony_music_windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            libmpv-dev mpv libayatana-appindicator3-dev libasound2-dev libssl-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Package Linux (tar.gz)
        run: |
          tar -czf harmony_music_linux_x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: harmony_music_linux_x64.tar.gz

  release:
    # Publishes a GitHub Release with all three builds when a v* tag is pushed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/android-apk/app-release.apk
            dist/windows-release/harmony_music_windows.zip
            dist/linux-release/harmony_music_linux_x64.tar.gz
